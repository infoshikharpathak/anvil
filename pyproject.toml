[project]
name = "anvil-ai"
version = "0.1.0"
description = "Framework-agnostic tool governance for agentic AI: policies, sequences, cross-app grants, credential injection and prompt-injection scanning on every tool call, plus an optional registry service."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Shikhar Pathak" }]
requires-python = ">=3.11"
keywords = ["agents", "llm", "governance", "tool-calling", "guardrails", "prompt-injection", "security"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
# The anvil library. The registry service (package "registry") needs the
# [registry] extra.
dependencies = [
  "pydantic>=2.0,<3",
  "httpx>=0.27",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
registry = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
]
dev = [
  "anvil-ai[registry]",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[project.urls]
Homepage = "https://github.com/infoshikharpathak/anvil"
Repository = "https://github.com/infoshikharpathak/anvil"
Issues = "https://github.com/infoshikharpathak/anvil/issues"
Changelog = "https://github.com/infoshikharpathak/anvil/blob/main/CHANGELOG.md"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["anvil", "registry", "registry.routes"]

[tool.setuptools.package-data]
registry = ["templates/*.html", "static/*"]

[tool.setuptools.package-dir]
anvil = "src/anvil"
registry = "registry"
"registry.routes" = "registry/routes"

[tool.pytest.ini_options]
asyncio_mode = "auto"
# evals/ (the injection eval) isn't an installed package; tests import it from the repo root.
pythonpath = ["."]
