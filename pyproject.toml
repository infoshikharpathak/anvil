[project]
name = "anvil-ai"
version = "0.1.0"
description = "Framework-agnostic tool governance for agentic AI pipelines."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["anvil", "registry", "registry.routes"]

[tool.setuptools.package-dir]
anvil = "src/anvil"
registry = "registry"
"registry.routes" = "registry/routes"

[tool.pytest.ini_options]
asyncio_mode = "auto"
